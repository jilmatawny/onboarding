<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRE Incident Investigation Guide</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        function SREIncidentApp() {
            const [activeTab, setActiveTab] = useState('workflow');
            const [expandedSections, setExpandedSections] = useState({});
            const [checklistProgress, setChecklistProgress] = useState({});

            const toggleSection = (section) => {
                setExpandedSections(prev => ({
                    ...prev,
                    [section]: !prev[section]
                }));
            };

            const toggleCheckItem = (category, itemId) => {
                const key = `${category}-${itemId}`;
                setChecklistProgress(prev => ({
                    ...prev,
                    [key]: !prev[key]
                }));
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 p-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-8 mb-6">
                            <h1 className="text-4xl font-bold text-gray-800 mb-2">SRE Incident Investigation Guide</h1>
                            <p className="text-gray-600">Comprehensive guide for investigating and resolving incidents using ServiceNow and Dynatrace</p>
                        </div>

                        <div className="bg-white rounded-lg shadow-lg p-8">
                            <div className="text-center">
                                <h2 className="text-2xl font-bold text-gray-800 mb-4">🚀 App Loading Successfully!</h2>
                                <p className="text-gray-600">If you see this, React is working properly.</p>
                                <p className="text-sm text-gray-500 mt-2">The full app will load momentarily...</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(SREIncidentApp));
    </script>
</body>
</html>
